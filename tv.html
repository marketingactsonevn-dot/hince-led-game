<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hince · StanbyME</title>
<!-- v2.8.13: LG StanbyME = video only (owner 27/11). Kiosks named TV… are sent here from index.html.
     Opened from raw.githack.com (outside the old game SW scope). Offline: the video is stored once in the Cache API and
     played from a blob URL (loops with no network); tv-sw.js keeps a copy of this page for a reload without network. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
</style>
</head>
<body>
<video id="v" autoplay muted loop playsinline preload="auto"></video>
<script>
(function () {
  var U = 'https://marketingactsonevn-dot.github.io/hince-led-game/assets/video/standby_tv.mp4', VC = 'hince-tv-video-v1', PC = 'hince-tv-page-v1';
  var v = document.getElementById('v'), last = -1, still = 0, blobUrl = '';
  function kick() { var p = v.play(); if (p && p.catch) p.catch(function () { }); }
  function setSrc(s, t) {
    v.src = s; v.load();
    if (t) v.addEventListener('loadedmetadata', function () { try { v.currentTime = t; } catch (e) { } }, { once: true });
    kick();
  }
  function reload() { setSrc(blobUrl || U + '?r=' + Date.now()); }
  function useBlob(res) { // play the stored copy: loops without network
    return res.blob().then(function (b) {
      if (b.size < 1000000) throw new Error('bad copy');
      blobUrl = URL.createObjectURL(b); setSrc(blobUrl, v.currentTime); window.tvOffline = true;
    });
  }
  v.addEventListener('canplay', kick);
  v.addEventListener('ended', function () { v.currentTime = 0; kick(); }); // loop fallback
  v.addEventListener('error', function () { setTimeout(reload, 5000); });
  // stuck video (webOS, network) → reload after ~10 s without progress
  setInterval(function () {
    if (v.currentTime === last) { if (++still >= 5) { still = 0; reload(); } } else { still = 0; last = v.currentTime; }
  }, 2000);

  if (!('caches' in window)) { setSrc(U); return; }
  caches.open(VC).then(function (c) {
    return c.match(U).then(function (hit) {
      if (hit) return useBlob(hit).catch(function () { return c.delete(U).then(function () { setSrc(U); }); });
      setSrc(U); // play from the network now, store a copy in the background
      return fetch(U, { mode: 'cors', cache: 'reload' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return c.put(U, r).then(function () { return c.match(U); }).then(useBlob);
      });
    });
  }).catch(function () { if (!v.currentSrc) setSrc(U); }); // no storage / no network: network only, retried by the watchdog

  // page copy for a reload without network (not on github.io: that scope belongs to the game's sw.js)
  if (location.host.indexOf('github.io') < 0 && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('tv-sw.js').catch(function () { });
    var here = location.href.split('#')[0];
    fetch(here, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      if (t.indexOf('standby_tv.mp4') < 0) return; // githack's "Open the page" notice, not this page
      return caches.open(PC).then(function (c) { return c.put(here, new Response(t, { headers: { 'Content-Type': 'text/html; charset=utf-8' } })); });
    }).catch(function () { });
  }
})();
</script>
</body>
</html>
